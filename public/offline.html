<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>صوت — غير متصل</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f3;
               font-family: 'Cairo', system-ui, sans-serif; color: #0f382d; text-align: center; padding: 2rem; }
        .icon { width: 64px; height: 64px; border-radius: 20px; background: #1f6b52; color: #ecd98f;
                display: grid; place-items: center; margin: 0 auto 1rem; font-size: 2rem; }
        p { color: #0f382d99; }
    </style>
</head>
<body>
    <div>
        <div class="icon">☾</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تحقّق من اتصالك ثم أعد المحاولة. يمكنك متابعة تتبّع عباداتك عند عودة الاتصال.</p>
    </div>
</body>
</html>
